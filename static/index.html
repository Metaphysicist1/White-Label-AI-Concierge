<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dussmann AI Concierge</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f7f6;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      #chat-container {
        width: 400px;
        height: 600px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #chat-header {
        background: #d32f2f;
        color: white;
        padding: 15px;
        text-align: center;
        font-weight: bold;
        font-size: 1.2rem;
      }
      #chat-box {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .message {
        padding: 10px 14px;
        border-radius: 8px;
        max-width: 80%;
        word-wrap: break-word;
      }
      .user-msg {
        background: #e3f2fd;
        color: #0d47a1;
        align-self: flex-end;
        border-bottom-right-radius: 0;
      }
      .bot-msg {
        background: #f1f3f4;
        color: #333;
        align-self: flex-start;
        border-bottom-left-radius: 0;
      }
      .loading {
        font-style: italic;
        color: #888;
        font-size: 0.9em;
        align-self: flex-start;
        display: none;
      }
      #input-area {
        display: flex;
        padding: 10px;
        background: #fff;
        border-top: 1px solid #eee;
      }
      #user-input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        outline: none;
      }
      #send-btn {
        background: #d32f2f;
        color: white;
        border: none;
        padding: 10px 15px;
        margin-left: 10px;
        border-radius: 5px;
        cursor: pointer;
      }
      #send-btn:hover {
        background: #b71c1c;
      }
      .quick-actions {
        display: flex;
        gap: 5px;
        padding: 0 15px 10px 15px;
        flex-wrap: wrap;
      }
      .action-btn {
        background: #eee;
        border: 1px solid #ccc;
        border-radius: 15px;
        padding: 5px 10px;
        font-size: 0.8rem;
        cursor: pointer;
        color: #333;
      }
      .action-btn:hover {
        background: #ddd;
      }
    </style>
  </head>
  <body>
    <div id="chat-container">
      <div id="chat-header">Dussmann Concierge</div>

      <div id="chat-box">
        <div class="message bot-msg">
          Hello! I am the Dussmann Digital Assistant. How can I help you today?
        </div>
      </div>
      <div class="loading" id="loading-indicator">Thinking...</div>

      <div id="input-area">
        <input
          type="text"
          id="user-input"
          placeholder="Type your message..."
          onkeypress="handleEnter(event)"
        />
        <button id="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>

    <script>
      const chatBox = document.getElementById("chat-box");
      const userInput = document.getElementById("user-input");
      const loading = document.getElementById("loading-indicator");

      function handleEnter(e) {
        if (e.key === "Enter") sendMessage();
      }

      function sendQuickMessage(text) {
        userInput.value = text;
        sendMessage();
      }

      async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // Add user message to UI
        appendMessage(text, "user-msg");
        userInput.value = "";

        // Show loading state
        loading.style.display = "block";
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
          // Call our FastAPI backend
          const response = await fetch("http://localhost:8000/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text }),
          });

          const data = await response.json();
          loading.style.display = "none";
          appendMessage(data.response, "bot-msg");
        } catch (error) {
          loading.style.display = "none";
          appendMessage("Error: Could not connect to the server.", "bot-msg");
        }
      }

      function appendMessage(text, className) {
        const msgDiv = document.createElement("div");
        msgDiv.className = "message " + className;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    </script>
  </body>
</html>
